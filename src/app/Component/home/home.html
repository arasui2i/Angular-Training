<div class="employee-container">
  <div class="page-header">
    <h2>Employees</h2>
    <button mat-raised-button (click)="addEmployee()">
      <mat-icon>add</mat-icon>
      Add Employee
    </button>
  </div>

  <table mat-table [dataSource]="dataSource" class="employee-table">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef>
        ID
      </th>
      <td mat-cell *matCellDef="let employee">
        {{ employee.id }}
      </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>
        Name
      </th>
      <td mat-cell *matCellDef="let employee">
        {{ employee.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef>
        Email
      </th>
      <td mat-cell *matCellDef="let employee">
        {{ employee.email }}
      </td>
    </ng-container>

    <ng-container matColumnDef="department">
      <th mat-header-cell *matHeaderCellDef>
        Department
      </th>
      <td mat-cell *matCellDef="let employee">
        {{ employee.department }}
      </td>
    </ng-container>

    <ng-container matColumnDef="designation">
      <th mat-header-cell *matHeaderCellDef>
        Designation
      </th>

      <td mat-cell *matCellDef="let employee">
        {{ employee.designation }}
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>
        Actions
      </th>
      <td mat-cell *matCellDef="let employee">
        <button mat-icon-button (click)="editEmployee(employee)" aria-label="Edit employee" class="action-btn">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button (click)="deleteEmployee(employee)" aria-label="Delete employee" class="action-btn">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns">
    </tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;">
    </tr>
  </table>
</div>
