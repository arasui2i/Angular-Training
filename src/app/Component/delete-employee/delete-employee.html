<div class="container">
    <h2>Delete Employee</h2>
    <mat-dialog-content width="100%">
        Do you want to delete the Employee?
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button mat-dialog-close (click)="closeDialog()">
            Cancel
        </button>
        <button mat-raised-button (click)="DeleteEmployee()">
            Yes
        </button>
    </mat-dialog-actions>
</div>
